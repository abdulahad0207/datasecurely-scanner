# Nixpacks build configuration for Railway deployment of DataSecurely Backend

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
    "python -m pip install --upgrade pip",
    "pip install -r requirements.txt"
]

[start]
cmd = "uvicorn app.api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
