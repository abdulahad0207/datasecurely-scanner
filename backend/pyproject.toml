[project]
name = "datasecurely-scanner"
version = "0.1.0"
description = "AI-assisted website security scanner for Indian SMBs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.4.0",
    "google-genai>=2.30.1",
    "redis>=5.0.8",
    "arq>=0.26.1",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "pyjwt[crypto]>=2.9.0",
    "sentry-sdk[fastapi]>=2.13.0",
    "razorpay>=1.4.1",
    "resend>=2.1.0",
    "asyncpg>=0.29.0",
    "playwright>=1.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
